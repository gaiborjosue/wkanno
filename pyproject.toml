[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wkanno"
version = "0.1.1"
description = "WebKnossos annotation and patch downloader for reproducible lab workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Josue Gaibor Lab Tools" }
]
keywords = ["webknossos", "annotation", "microscopy", "cli", "nifti", "zarr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Utilities",
]
dependencies = [
  "nibabel>=5.0",
  "numpy>=1.24",
  "requests>=2.31",
  "wkw>=1.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.urls]
Documentation = "https://github.com/gaiborjosue/wkanno"
Issues = "https://github.com/gaiborjosue/wkanno/issues"
Repository = "https://github.com/gaiborjosue/wkanno"

[project.scripts]
wkanno = "wkanno.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wkanno"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/README.md",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["wkanno"]